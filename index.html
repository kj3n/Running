<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 다이어트 & 러닝 AI 대시보드</title>
    <!-- CSS 스타일: 기존 스타일에 API 키 입력란 강조 스타일을 추가했습니다. -->
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .api-input { border-color: #007bff; background-color: #f8fbff; } /* API 키 입력란 색상 변경 */
        button { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; } /* 로딩 중 버튼 스타일 */
        #result { margin-top: 20px; padding: 20px; background-color: #e9ecef; border-radius: 5px; display: none; white-space: pre-line; } /* white-space는 줄바꿈 유지를 위해 추가 */
    </style>
</head>
<body>

<div class="container">
    <h1>🏃‍♂️ 오늘 하루 요약</h1>
    
    <!-- 사용자 정보 입력 폼 -->
    <label for="distance">오늘 뛴 거리 (km):</label>
    <input type="number" id="distance" placeholder="예: 3.5" step="0.1">

    <label for="time">뛰는 데 걸린 시간 (분):</label>
    <input type="number" id="time" placeholder="예: 35">

    <label for="intake">오늘 섭취한 칼로리 (kcal):</label>
    <input type="number" id="intake" placeholder="예: 1800">

    <!-- Gemini API 키 입력 폼 (보안을 위해 type을 password로 설정해도 무방합니다) -->
    <label for="apiKey">🔑 Gemini API Key (저장되지 않고 즉시 휘발됩니다):</label>
    <input type="text" id="apiKey" class="api-input" placeholder="AI Studio에서 발급받은 키를 입력하세요">

    <!-- 클릭 시 API 호출을 시작하는 버튼 -->
    <button id="submitBtn" onclick="analyzeData()">실제 AI 분석 결과 보기 (Gemini 연동)</button>

    <!-- 결과와 AI 피드백이 출력될 공간 -->
    <div id="result"></div>
</div>

<script>
    // 네트워크 통신(API 호출)을 해야 하므로 async(비동기) 함수로 선언합니다.
    async function analyzeData() {
        // 1. 화면에 입력된 데이터들을 변수로 가져옵니다.
        const distance = parseFloat(document.getElementById('distance').value);
        const time = parseInt(document.getElementById('time').value);
        const intake = parseInt(document.getElementById('intake').value);
        const apiKey = document.getElementById('apiKey').value.trim(); // 양쪽 공백 제거
        const weight = 95; // 현재 체중 (kg) 고정

        // 2. 누락된 값이 있는지 확인하는 유효성 검사입니다.
        if (isNaN(distance) || isNaN(time) || isNaN(intake)) {
            alert("운동 및 식단 항목에 숫자를 정확히 입력해주세요!");
            return;
        }
        if (!apiKey) {
            alert("Gemini API 키를 입력해주세요!");
            return;
        }

        // 3. 버튼을 비활성화하고 로딩 상태를 표시하여 중복 클릭을 방지합니다.
        const btn = document.getElementById('submitBtn');
        btn.innerText = "AI가 분석 중입니다... 잠시만 기다려주세요 ⏳";
        btn.disabled = true;

        // 4. 기본적인 칼로리와 페이스 수동 계산 (화면 표기 및 프롬프트 제공용)
        const pace = time / distance;
        const paceMinutes = Math.floor(pace);
        const paceSeconds = Math.round((pace - paceMinutes) * 60);
        const burnedCalories = Math.round(weight * distance * 1.036);
        const bmr = 2000; 
        const totalBurned = bmr + burnedCalories;
        const netCalories = totalBurned - intake;

        // 5. Gemini에게 전달할 질문(Prompt)을 작성합니다. 구체적일수록 답변이 좋습니다.
        const promptText = `
            나는 키 181cm, 몸무게 95kg이고 75kg까지 감량하는 것이 목표야.
            오늘 나의 기록은 다음과 같아:
            - 달린 거리: ${distance}km
            - 달린 시간: ${time}분 (평균 페이스: 1km당 ${paceMinutes}분 ${paceSeconds}초)
            - 운동 소모 칼로리: ${burnedCalories}kcal
            - 오늘 섭취한 총 칼로리: ${intake}kcal
            - 오늘의 넷 칼로리 (총 소모량 - 섭취량): ${netCalories}kcal

            위 데이터를 바탕으로 다이어트와 무릎 관절을 보호하는 러닝 관점에서, 
            오늘 하루에 대한 평가와 내일을 위한 구체적인 조언을 3~4문장으로 다정하게 해줘.
        `;

        // 6. 통신 오류를 잡기 위해 try-catch 블록을 사용합니다.
        try {
            // Gemini 1.5 Flash 모델의 API 호출 엔드포인트 URL입니다. (주소 끝에 API 키를 붙입니다)
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`;
            
            // HTTP POST 요청을 통해 JSON 형태로 프롬프트를 전송합니다.
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: promptText }] // 위에서 만든 프롬프트를 넣는 부분
                    }]
                })
            });

            // 7. API 응답이 실패한 경우 (예: 잘못된 API 키) 오류를 발생시킵니다.
            if (!response.ok) {
                throw new Error(`API 통신 에러: ${response.status}`);
            }

            // 8. 응답받은 데이터를 JSON 형태로 변환합니다.
            const data = await response.json();
            
            // JSON 구조 안에서 실제 AI가 답변한 텍스트 껍데기만 추출합니다.
            const aiFeedback = data.candidates[0].content.parts[0].text;

            // 9. 계산된 수치들과 AI의 실제 피드백을 화면에 출력합니다.
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <h3>📊 오늘 하루 계산 결과</h3>
                <p>⏱️ <b>평균 페이스:</b> 1km당 ${paceMinutes}분 ${paceSeconds}초</p>
                <p>🔥 <b>운동 소모 칼로리:</b> ${burnedCalories} kcal</p>
                <p>🍽️ <b>오늘의 넷 칼로리:</b> ${netCalories > 0 ? "+" : ""}${netCalories} kcal</p>
                <hr>
                <h3>🤖 진짜 Gemini AI 피드백</h3>
                <p>${aiFeedback}</p>
            `;

        } catch (error) {
            // 에러 발생 시 알림창을 띄워 사용자에게 알립니다.
            alert("AI 분석 중 오류가 발생했습니다. API 키가 정확한지 확인해주세요.\n상세 에러: " + error.message);
        } finally {
            // 10. 통신이 끝났으므로(성공이든 실패든) 버튼 상태를 원래대로 되돌립니다.
            btn.innerText = "실제 AI 분석 결과 보기 (Gemini 연동)";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
